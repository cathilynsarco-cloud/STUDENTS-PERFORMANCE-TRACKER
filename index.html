<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math 7 Teacher Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

  <!-- TOP HEADER / NAVBAR -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid font-bold fa-calculator text-2xl text-indigo-200"></i>
        <h1 class="text-xl font-bold tracking-wide">Math 7 Class Portal</h1>
      </div>
      <div id="save-status" class="text-xs bg-indigo-800 px-3 py-1 rounded-full text-indigo-200 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-400"></span> Connected
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-grow grid grid-cols-1 md:grid-cols-4 gap-6">

    <!-- SIDEBAR: SECTIONS -->
    <aside class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm border border-slate-200 h-fit">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-slate-700 text-lg">Sections</h2>
        <button onclick="addSection()" class="text-sm bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold px-2.5 py-1 rounded-lg transition">
          + Add
        </button>
      </div>
      <div id="sections-list" class="space-y-2">
        <!-- Rendered by JS -->
      </div>
    </aside>

    <!-- CONTENT AREA -->
    <section class="md:col-span-3 space-y-6">

      <!-- BANNER / TITLE CARD -->
      <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 relative overflow-hidden">
        <div class="flex justify-between items-start">
          <div>
            <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">Grade 7 Mathematics</span>
            <h2 id="active-section-title" class="text-2xl font-extrabold text-slate-800 mt-1">Select a Section</h2>
            <p id="active-section-desc" class="text-sm text-slate-500 mt-1">Manage your students, grading, and activities below.</p>
          </div>
          <button onclick="deleteActiveSection()" class="text-xs text-rose-500 hover:text-rose-700 font-medium">Delete Section</button>
        </div>
      </div>

      <!-- TAB NAVIGATION -->
      <div class="border-b border-slate-200 flex space-x-4">
        <button id="tab-btn-students" onclick="switchTab('students')" class="pb-2 border-b-2 font-semibold text-sm border-indigo-600 text-indigo-600">
          <i class="fa-solid fa-users mr-1.5"></i> Students (<span id="student-count">0</span>)
        </button>
        <button id="tab-btn-activities" onclick="switchTab('activities')" class="pb-2 border-b-2 font-semibold text-sm border-transparent text-slate-500 hover:text-slate-700">
          <i class="fa-solid fa-list-check mr-1.5"></i> Activities & Grades
        </button>
      </div>

      <!-- TAB 1: STUDENTS PANEL -->
      <div id="tab-students" class="space-y-4">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <input type="text" id="student-search" oninput="render()" placeholder="Search student name..." class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button onclick="addStudent()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2 rounded-lg transition shadow-sm">
            + Add Student
          </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
              <tr>
                <th class="p-3">LRN / ID</th>
                <th class="p-3">Name</th>
                <th class="p-3 text-center">Gender</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="students-table-body" class="divide-y divide-slate-100">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- TAB 2: ACTIVITIES PANEL -->
      <div id="tab-activities" class="hidden space-y-4">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <h3 class="font-bold text-slate-700">Class Activities & Quizzes</h3>
          <button onclick="addActivity()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2 rounded-lg transition shadow-sm">
            + Create Activity
          </button>
        </div>

        <div id="activities-list" class="space-y-3">
          <!-- Rendered by JS -->
        </div>
      </div>

    </section>

  </main>

  <!-- FIREBASE COMPAT LIBRARIES FOR FIRESTORE -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // -------------------------------------------------------------
    // FIREBASE CONFIGURATION (math7-database-26)
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyA0Yez-NLfbhU2Zj7CqeyNAgJ-vOQYVlvw",
      authDomain: "math7-database-26.firebaseapp.com",
      databaseURL: "https://math7-database-26-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "math7-database-26",
      storageBucket: "math7-database-26.firebasestorage.app",
      messagingSenderId: "1057749107077",
      appId: "1:1057749107077:web:aae6d67955e0ba75f0c4ec"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Isolated database document path for Math 7
    const docRef = db.collection('dashboard').doc('state_math7');

    // -------------------------------------------------------------
    // APPLICATION STATE
    // -------------------------------------------------------------
    let state = {
      activeSectionId: null,
      activeTab: 'students',
      sections: [
        {
          id: 'sec_1',
          name: 'Section 7-A (Euler)',
          students: [
            { id: 'st_1', lrn: '10982374001', name: 'Santos, Maria', gender: 'F' },
            { id: 'st_2', lrn: '10982374002', name: 'Reyes, Juan', gender: 'M' }
          ],
          activities: [
            { id: 'act_1', title: 'Quiz 1: Integer Operations', maxScore: 20 }
          ]
        }
      ]
    };

    // -------------------------------------------------------------
    // FIRESTORE REALTIME SYNC
    // -------------------------------------------------------------
    docRef.onSnapshot((doc) => {
      const statusEl = document.getElementById('save-status');
      if (doc.exists) {
        state = Object.assign({}, state, doc.data());
        if (!state.activeSectionId && state.sections.length > 0) {
          state.activeSectionId = state.sections[0].id;
        }
        render();
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-400"></span> Synced`;
      } else {
        // Initial setup if Firestore document does not exist yet
        saveState();
      }
    }, (error) => {
      console.error("Firestore sync error:", error);
      document.getElementById('save-status').innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> Error`;
    });

    // Save changes to Cloud Firestore safely
    function saveState() {
      const statusEl = document.getElementById('save-status');
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Saving...`;

      // Clean image files or heavy objects if needed to prevent 1MB overflow
      docRef.set(state)
        .then(() => {
          statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-400"></span> Saved`;
        })
        .catch((error) => {
          console.error("Database Save Error: ", error);
          alert("Failed to save changes! Check browser console (F12) or Firestore Rules.");
          statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> Save Failed`;
        });
    }

    // -------------------------------------------------------------
    // UI CORE ACTIONS
    // -------------------------------------------------------------
    function switchTab(tab) {
      state.activeTab = tab;
      render();
    }

    function selectSection(id) {
      state.activeSectionId = id;
      render();
    }

    function addSection() {
      const name = prompt("Enter new section name (e.g., Section 7-B):");
      if (!name) return;
      const newSec = {
        id: 'sec_' + Date.now(),
        name: name,
        students: [],
        activities: []
      };
      state.sections.push(newSec);
      state.activeSectionId = newSec.id;
      saveState();
      render();
    }

    function deleteActiveSection() {
      if (!state.activeSectionId) return;
      if (!confirm("Are you sure you want to delete this section and all its records?")) return;
      
      state.sections = state.sections.filter(s => s.id !== state.activeSectionId);
      state.activeSectionId = state.sections.length > 0 ? state.sections[0].id : null;
      saveState();
      render();
    }

    function addStudent() {
      const activeSec = getActiveSection();
      if (!activeSec) return alert("Please select or create a section first.");

      const name = prompt("Enter Student Full Name (Last, First):");
      if (!name) return;
      const lrn = prompt("Enter Student LRN / ID Number:") || "N/A";

      activeSec.students.push({
        id: 'st_' + Date.now(),
        name: name,
        lrn: lrn,
        gender: 'M'
      });

      saveState();
      render();
    }

    function deleteStudent(studentId) {
      const activeSec = getActiveSection();
      if (!activeSec) return;
      activeSec.students = activeSec.students.filter(s => s.id !== studentId);
      saveState();
      render();
    }

    function addActivity() {
      const activeSec = getActiveSection();
      if (!activeSec) return alert("Please select or create a section first.");

      const title = prompt("Enter Activity Title:");
      if (!title) return;
      const maxScore = parseInt(prompt("Enter Maximum Score:", "20")) || 20;

      activeSec.activities.push({
        id: 'act_' + Date.now(),
        title: title,
        maxScore: maxScore
      });

      saveState();
      render();
    }

    function deleteActivity(actId) {
      const activeSec = getActiveSection();
      if (!activeSec) return;
      activeSec.activities = activeSec.activities.filter(a => a.id !== actId);
      saveState();
      render();
    }

    function getActiveSection() {
      return state.sections.find(s => s.id === state.activeSectionId);
    }

    // -------------------------------------------------------------
    // RENDER FUNCTION
    // -------------------------------------------------------------
    function render() {
      // 1. Render Sections List
      const sectionsContainer = document.getElementById('sections-list');
      sectionsContainer.innerHTML = '';

      if (state.sections.length === 0) {
        sectionsContainer.innerHTML = `<p class="text-xs text-slate-400 italic">No sections created yet.</p>`;
      } else {
        state.sections.forEach(sec => {
          const isActive = sec.id === state.activeSectionId;
          const btn = document.createElement('button');
          btn.className = `w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition flex justify-between items-center ${
            isActive 
              ? 'bg-indigo-600 text-white shadow-sm' 
              : 'text-slate-600 hover:bg-slate-100'
          }`;
          btn.onclick = () => selectSection(sec.id);
          btn.innerHTML = `
            <span class="truncate">${sec.name}</span>
            <span class="text-xs px-2 py-0.5 rounded-full ${isActive ? 'bg-indigo-500 text-white' : 'bg-slate-200 text-slate-600'}">${sec.students.length}</span>
          `;
          sectionsContainer.appendChild(btn);
        });
      }

      // 2. Active Section Info
      const activeSec = getActiveSection();
      if (activeSec) {
        document.getElementById('active-section-title').textContent = activeSec.name;
        document.getElementById('active-section-desc').textContent = `${activeSec.students.length} Students | ${activeSec.activities.length} Recorded Activities`;
        document.getElementById('student-count').textContent = activeSec.students.length;
      } else {
        document.getElementById('active-section-title').textContent = "No Active Section";
        document.getElementById('active-section-desc').textContent = "Create or select a section from the sidebar.";
        document.getElementById('student-count').textContent = "0";
      }

      // 3. Tab Visibility
      const tabStudents = document.getElementById('tab-students');
      const tabActivities = document.getElementById('tab-activities');
      const btnStudents = document.getElementById('tab-btn-students');
      const btnActivities = document.getElementById('tab-btn-activities');

      if (state.activeTab === 'students') {
        tabStudents.classList.remove('hidden');
        tabActivities.classList.add('hidden');
        btnStudents.className = "pb-2 border-b-2 font-semibold text-sm border-indigo-600 text-indigo-600";
        btnActivities.className = "pb-2 border-b-2 font-semibold text-sm border-transparent text-slate-500 hover:text-slate-700";
      } else {
        tabStudents.classList.add('hidden');
        tabActivities.classList.remove('hidden');
        btnStudents.className = "pb-2 border-b-2 font-semibold text-sm border-transparent text-slate-500 hover:text-slate-700";
        btnActivities.className = "pb-2 border-b-2 font-semibold text-sm border-indigo-600 text-indigo-600";
      }

      // 4. Render Students Table
      const tableBody = document.getElementById('students-table-body');
      tableBody.innerHTML = '';
      const searchQuery = (document.getElementById('student-search').value || '').toLowerCase();

      if (activeSec && activeSec.students.length > 0) {
        const filtered = activeSec.students.filter(s => s.name.toLowerCase().includes(searchQuery));
        filtered.forEach(s => {
          const row = document.createElement('tr');
          row.className = "hover:bg-slate-50 transition";
          row.innerHTML = `
            <td class="p-3 text-slate-500 font-mono text-xs">${s.lrn}</td>
            <td class="p-3 font-medium text-slate-800">${s.name}</td>
            <td class="p-3 text-center"><span class="px-2 py-0.5 text-xs rounded-full ${s.gender === 'F' ? 'bg-pink-100 text-pink-700' : 'bg-blue-100 text-blue-700'}">${s.gender}</span></td>
            <td class="p-3 text-right">
              <button onclick="deleteStudent('${s.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-medium">Remove</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } else {
        tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400 text-sm">No students recorded in this section.</td></tr>`;
      }

      // 5. Render Activities
      const activitiesContainer = document.getElementById('activities-list');
      activitiesContainer.innerHTML = '';

      if (activeSec && activeSec.activities.length > 0) {
        activeSec.activities.forEach(act => {
          const card = document.createElement('div');
          card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center";
          card.innerHTML = `
            <div>
              <h4 class="font-bold text-slate-800">${act.title}</h4>
              <p class="text-xs text-slate-500">Max Score: <span class="font-semibold text-indigo-600">${act.maxScore} pts</span></p>
            </div>
            <button onclick="deleteActivity('${act.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-medium">Delete</button>
          `;
          activitiesContainer.appendChild(card);
        });
      } else {
        activitiesContainer.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 text-center text-slate-400 text-sm">No activities created yet.</div>`;
      }
    }

    // Initial First Render
    render();
  </script>
</body>
</html>
